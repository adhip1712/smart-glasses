name: Build Visionary Nexus Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Frontend/**'
      - '.github/workflows/android-build.yml'
  push:
    branches:
      - main
    paths:
      - 'Frontend/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install frontend and Capacitor dependencies
        working-directory: Frontend
        run: npm install --no-audit --no-fund

      - name: Build web application
        working-directory: Frontend
        run: npm run build

      - name: Generate Android project and sync web assets
        working-directory: Frontend
        run: |
          npx cap add android
          npx cap sync android

      - name: Build installable debug APK
        working-directory: Frontend/android
        run: ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: visionary-nexus-android-debug
          path: Frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
